plugins {
    id "com.android.application"
    id "kotlin-android"
    // The Flutter Gradle Plugin must be applied after the Android and Kotlin Gradle plugins.
    id "dev.flutter.flutter-gradle-plugin"
}

android {
    namespace = "com.spendwise.app"
    compileSdk = flutter.compileSdkVersion
    ndkVersion = flutter.ndkVersion

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_1_8
        targetCompatibility = JavaVersion.VERSION_1_8
    }

    kotlinOptions {
        jvmTarget = "1.8"
    }

    defaultConfig {
        applicationId = "com.spendwise.app"
        minSdk = 23
        targetSdk = flutter.targetSdkVersion
        versionCode = flutter.versionCode
        versionName = flutter.versionName
        multiDexEnabled = true

        // Google's official test ID by default. Release builds should pass
        // -PadmobAppId=ca-app-pub-XXXXXXXX~XXXXXXXX.
        manifestPlaceholders["admobAppId"] =
                (project.findProperty("admobAppId") ?: "ca-app-pub-3940256099942544~3347511713") as String
    }

    buildTypes {
        release {
            // Replace with a real signing config before publishing.
            signingConfig = signingConfigs.debug
            minifyEnabled = false
            shrinkResources = false
        }
    }
}

flutter {
    source = "../.."
}

dependencies {
    implementation "androidx.core:core-ktx:1.13.1"
    implementation "androidx.security:security-crypto:1.1.0-alpha06"
    implementation "com.google.android.gms:play-services-ads:23.6.0"
}
