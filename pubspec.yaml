name: spendwise
description: >-
  Spendwise is a privacy-first, on-device finance tracker that turns bank emails,
  SMS alerts and payment notifications into a categorised, encrypted ledger.
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.5.0 <4.0.0"
  flutter: ">=3.24.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # State management
  flutter_riverpod: ^2.6.1

  # Encrypted local persistence
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  flutter_secure_storage: ^9.2.2

  # Gmail ingestion
  google_sign_in: ^6.2.2
  googleapis: ^13.2.0
  http: ^1.2.2
  html: ^0.15.4

  # Presentation
  intl: ^0.19.0
  fl_chart: ^0.69.0

  # Monetisation
  google_mobile_ads: ^5.2.0

  # Platform integration
  permission_handler: ^11.3.1
  connectivity_plus: ^6.0.5

  # Utilities
  crypto: ^3.0.5
  collection: ^1.18.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
